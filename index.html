<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07111f" />
    <title>无限协议 · v0.1</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ambient ambient-a"></div>
    <div class="ambient ambient-b"></div>
    <main class="game-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">INFINITE PROTOCOL / v0.1</p>
          <h1>无限协议</h1>
        </div>
        <div class="source-counter" title="转生后可用于永久升级">
          <span>源代码</span>
          <strong id="source-code">0</strong>
        </div>
      </header>

      <section class="status-grid" aria-label="关卡状态">
        <article class="status-card">
          <span>当前层级</span>
          <strong id="stage-value">01</strong>
        </article>
        <article class="status-card wide">
          <div class="status-line"><span>本层算力</span><b id="score-label">0 / 55</b></div>
          <div class="progress-track"><div id="score-progress" class="progress-fill"></div></div>
        </article>
        <article class="status-card">
          <span>运行缓存</span>
          <strong id="run-data">0</strong>
        </article>
      </section>

      <section class="preview-panel" id="preview-panel">
        <div class="preview-score">
          <span>预计输出</span>
          <strong id="preview-score">0</strong>
        </div>
        <div class="formula" id="score-formula">选择芯片以预览协议</div>
        <div class="protocol-list" id="protocol-list"></div>
      </section>

      <section class="hand-section">
        <div class="section-heading">
          <div>
            <span class="section-kicker">ACTIVE BUFFER</span>
            <h2>芯片缓存</h2>
          </div>
          <div class="turn-stats">
            <span>运算 <b id="plays-left">3</b></span>
            <span>重排 <b id="rerolls-left">2</b></span>
          </div>
        </div>
        <div id="hand" class="hand" aria-label="手牌"></div>
        <p class="selection-help" id="selection-help">点击选择最多 5 张芯片；再次点击可取消。</p>
        <div class="action-row">
          <button id="reroll-button" class="button secondary" disabled>重排所选</button>
          <button id="play-button" class="button primary" disabled>执行协议</button>
        </div>
      </section>

      <section class="system-panel">
        <div class="mini-stat"><span>牌组</span><b id="deck-size">12 张</b></div>
        <div class="mini-stat"><span>已装模块</span><b id="module-count">0</b></div>
        <button id="module-button" class="text-button">查看模块</button>
        <button id="rebirth-button" class="text-button danger" disabled>主动转生</button>
      </section>

      <section class="event-log" aria-live="polite">
        <span class="pulse-dot"></span>
        <p id="event-message">系统等待启动。</p>
      </section>

      <footer>
        <button id="help-button" class="footer-button">规则说明</button>
        <span>存档保存在当前浏览器</span>
        <button id="reset-button" class="footer-button">重置存档</button>
      </footer>
    </main>

    <div id="modal-backdrop" class="modal-backdrop visible">
      <section id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></section>
    </div>

    <div id="toast" class="toast" aria-live="polite"></div>

    <script src="core.js"></script>
    <script src="game.js"></script>
  </body>
</html>
